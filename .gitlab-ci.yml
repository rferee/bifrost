stages:
  - check
  - build

default:
  interruptible: true

# $CI_REGISTRY_IMAGE already resolves to
# docker-registry.internal.rferee.dev/rferee/bifrost, and $CI_REGISTRY_USER /
# $CI_REGISTRY_PASSWORD are the per-job token. No credentials to configure.

.python:
  image: python:3.12-slim
  cache:
    key: pip-$CI_COMMIT_REF_SLUG
    paths:
      - .cache/pip
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  before_script:
    - pip install --quiet --upgrade pip
    - pip install --quiet -e ".[dev]"

lint:
  stage: check
  extends: .python
  script:
    - ruff check .

test:
  stage: check
  extends: .python
  script:
    - pytest -q

# The runners talk to the host daemon over a mounted socket, so there is no
# dind service and no TLS variables. Adding them breaks the job: the dind
# container is unprivileged and never writes /certs/client.
build:
  stage: build
  image: docker:27-cli
  script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE:latest -t $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA .
    - docker push $CI_REGISTRY_IMAGE:latest
    - docker push $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
